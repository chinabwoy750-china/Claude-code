<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Code Web</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f4f5;height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}#login{height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#15181d;border:1px solid #292e36;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0008}.logo{font-size:26px;font-weight:700}.muted{color:#969da8;font-size:14px;margin-top:6px}.field{display:flex;flex-direction:column;gap:8px;margin-top:20px}input,textarea,select{background:#0e1115;color:#fff;border:1px solid #303641;border-radius:12px;padding:12px;outline:none}.primary{width:100%;border:0;background:#f2f2f2;color:#101114;border-radius:12px;padding:12px;margin-top:18px;font-weight:700}#error{color:#ff7d7d;margin-top:12px;font-size:14px}#app{height:100vh;display:none;grid-template-rows:auto 1fr auto}header{height:64px;border-bottom:1px solid #242830;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:700}.controls{display:flex;gap:8px;align-items:center}select{padding:8px 30px 8px 10px;max-width:55vw}.ghost{background:transparent;border:1px solid #303641;color:#d8dbe0;border-radius:10px;padding:8px 11px}#messages{overflow:auto;padding:24px 16px 30px}.thread{width:min(900px,100%);margin:auto;display:flex;flex-direction:column;gap:18px}.msg{max-width:85%;white-space:pre-wrap;line-height:1.55;border-radius:16px;padding:13px 15px}.user{align-self:flex-end;background:#262b33}.assistant{align-self:flex-start;background:#15181d;border:1px solid #252a32}.meta{font-size:11px;color:#777f8b;margin-bottom:6px}footer{border-top:1px solid #242830;padding:12px 16px 16px}.composer{width:min(900px,100%);margin:auto;display:flex;gap:10px;align-items:flex-end}textarea{flex:1;min-height:50px;max-height:180px;resize:vertical}.send{border:0;border-radius:12px;background:#f2f2f2;color:#111;padding:12px 18px;font-weight:700}.send:disabled{opacity:.5}.status{width:min(900px,100%);margin:7px auto 0;color:#737b87;font-size:12px}</style></head><body><div id="login"><div class="card"><div class="logo">Claude Code Web</div><div class="muted">Your private Claude Code workspace</div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="UI password"></div><button class="primary" id="loginBtn">Sign in</button><div id="error"></div></div></div><div id="app"><header><div class="brand">Claude Code Web</div><div class="controls"><select id="model"></select><button class="ghost" id="logout">Log out</button></div></header><main id="messages"><div class="thread" id="thread"></div></main><footer><div class="composer"><textarea id="input" placeholder="Ask Claude Code anything…"></textarea><button class="send" id="send">Send</button></div><div class="status" id="status"></div></footer></div><script>const $=id=>document.getElementById(id);let busy=false;async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.error||'Request failed');return d}function showApp(){$('login').style.display='none';$('app').style.display='grid';loadModels()}function showLogin(){$('app').style.display='none';$('login').style.display='grid'}async function check(){try{await api('/api/me');showApp()}catch{showLogin()}}async function login(){ $('error').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showApp()}catch(e){$('error').textContent=e.message}}async function loadModels(){try{const d=await api('/api/models');$('model').innerHTML='';d.models.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.name||m.id;$('model').appendChild(o)})}catch(e){$('status').textContent=e.message}}function add(role,text,model=''){const w=document.createElement('div');w.className='msg '+role;const m=document.createElement('div');m.className='meta';m.textContent=role==='user'?'You':'Claude Code'+(model?' · '+model:'');const b=document.createElement('div');b.textContent=text;w.append(m,b);$('thread').appendChild(w);$('messages').scrollTop=$('messages').scrollHeight}async function send(){if(busy)return;const text=$('input').value.trim();if(!text)return;busy=true;$('send').disabled=true;$('status').textContent='Claude Code is working…';add('user',text);$('input').value='';try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text,model:$('model').value})});add('assistant',d.result||'(No text returned)',d.model);$('status').textContent=''}catch(e){add('assistant','Error: '+e.message);$('status').textContent='Request failed'}finally{busy=false;$('send').disabled=false;$('input').focus()}}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}finally{showLogin()}};check();</script></body></html>
